[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ventilator-breath-classification"
version = "0.1.0"
description = "Interpretable features and evaluation for ventilator breath classification"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Siyun Chen"}]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "scipy>=1.12,<2",
  "scikit-learn>=1.5,<1.8",
  "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
ventilator = "ventilator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
